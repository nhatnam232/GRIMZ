<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRIMZ CLOUD PC — Đã chuyển địa chỉ</title>
  <meta http-equiv="refresh" content="30;url=https://grimzcloud.pages.dev">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09080f;
      color: #e4e0f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .box {
      border: 1px solid rgba(124,92,191,0.3);
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
    }
    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #7c5cbf;
      margin-bottom: 1.5rem;
    }
    .logo span { color: #9b7fe8; }
    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      color: #e4e0f0;
    }
    p {
      font-size: 0.85rem;
      color: #8a84a0;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-block;
      background: #7c5cbf;
      color: #fff;
      text-decoration: none;
      padding: 0.65rem 1.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    a:hover { background: #9b7fe8; }
    .countdown {
      margin-top: 1.25rem;
      font-size: 0.7rem;
      color: #5a5470;
      letter-spacing: 0.1em;
    }
    .countdown span { color: #f87171; font-weight: 700; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">GRIMZ <span>CLOUD</span> PC</div>
    <h1>🚀 We've moved to a new address</h1>
    <p>
      This project has moved to a new home.<br>
      You will be automatically redirected in <span id="cd">30</span> seconds.
    </p>
    <a href="https://grimzcloud.pages.dev">Go to new site →</a>
    <div class="countdown">Redirecting in <span id="cd2">30</span>s</div>
  </div>

  <script>
    let t = 30;
    const cd = document.getElementById('cd');
    const cd2 = document.getElementById('cd2');
    const interval = setInterval(() => {
      t--;
      cd.textContent = t;
      cd2.textContent = t;
      if (t <= 0) {
        clearInterval(interval);
        window.location.replace('https://grimzcloud.pages.dev');
      }
    }, 1000);
  </script>
</body>
</html>
