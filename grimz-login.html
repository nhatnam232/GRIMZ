<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimz Cloud PC — Đăng nhập</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root {
    --bg:#09080f; --bg2:#100e1a; --bg3:#161323;
    --accent:#7c5cbf; --accent2:#9b7fe8; --accent3:#5a3fa0;
    --green:#4ade80; --red:#f87171;
    --text:#e4e0f0; --muted:#8a84a0; --border:rgba(124,92,191,0.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Poppins',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  /* Background */
  body::before {
    content:''; position:fixed; inset:0;
    background-image:linear-gradient(rgba(124,92,191,0.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(124,92,191,0.04) 1px,transparent 1px);
    background-size:44px 44px; pointer-events:none; z-index:0;
  }
  .glow-orb {
    position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    filter:blur(80px);
  }
  .glow-orb-1 { width:500px; height:500px; background:rgba(124,92,191,0.07); top:-150px; right:-150px; animation:orbFloat 8s ease-in-out infinite; }
  .glow-orb-2 { width:400px; height:400px; background:rgba(90,63,160,0.05); bottom:-100px; left:-100px; animation:orbFloat 10s ease-in-out infinite reverse; }
  @keyframes orbFloat { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-20px)} }

  /* Scanline */
  .scanline { position:fixed; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(124,92,191,0.15),transparent); animation:scan 6s linear infinite; pointer-events:none; z-index:1; }
  @keyframes scan { 0%{transform:translateY(-1px)} 100%{transform:translateY(100vh)} }

  /* Container */
  .container { position:relative; z-index:2; width:100%; max-width:420px; padding:1.5rem; }

  /* Logo */
  .logo { text-align:center; margin-bottom:2rem; }
  .logo-text { font-family:'Rajdhani',sans-serif; font-size:1.5rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); text-shadow:0 0 20px rgba(124,92,191,0.4); }
  .logo-text span { color:var(--accent2); }
  .logo-sub { font-family:'JetBrains Mono',monospace; font-size:0.6rem; color:var(--muted); letter-spacing:0.25em; text-transform:uppercase; margin-top:0.3rem; }

  /* Card */
  .card {
    background:var(--bg2);
    border:1px solid var(--border);
    padding:2rem;
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(10px);
    clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--accent3),var(--accent2),var(--accent3)); }
  .card::after { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%,rgba(124,92,191,0.05) 0%,transparent 60%); pointer-events:none; }

  /* Corners */
  .corner { position:absolute; width:8px; height:8px; }
  .corner-tl { top:4px; left:4px; border-top:1px solid var(--accent2); border-left:1px solid var(--accent2); }
  .corner-br { bottom:4px; right:4px; border-bottom:1px solid var(--accent2); border-right:1px solid var(--accent2); }

  /* Tabs */
  .tabs { display:flex; margin-bottom:1.75rem; border-bottom:1px solid var(--border); position:relative; z-index:1; }
  .tab { flex:1; padding:0.65rem 0; text-align:center; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); border-bottom:2px solid transparent; transition:all 0.2s; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--accent2); border-bottom-color:var(--accent2); }

  /* Form */
  .form-group { margin-bottom:1rem; position:relative; z-index:1; }
  label { display:block; font-family:'JetBrains Mono',monospace; font-size:0.6rem; color:var(--muted); margin-bottom:0.4rem; letter-spacing:0.15em; text-transform:uppercase; }
  input[type="email"], input[type="password"], input[type="text"] {
    width:100%; padding:0.65rem 0.85rem;
    background:var(--bg3); border:1px solid var(--border);
    color:var(--text); font-family:'Poppins',sans-serif; font-size:0.875rem;
    outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color:var(--accent2); box-shadow:0 0 0 2px rgba(124,92,191,0.12); }
  input::placeholder { color:var(--muted); font-size:0.82rem; }

  /* Turnstile */
  .cf-turnstile { margin:0.75rem 0; display:flex; justify-content:center; }

  /* Button */
  .btn {
    width:100%; padding:0.75rem;
    background:var(--accent); border:none; color:#fff;
    font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:700;
    letter-spacing:0.12em; text-transform:uppercase;
    cursor:pointer; margin-top:0.25rem;
    transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
    position:relative; overflow:hidden; z-index:1;
  }
  .btn::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent); opacity:0; transition:opacity 0.2s; }
  .btn:hover { background:var(--accent2); transform:translateY(-2px); box-shadow:0 6px 20px rgba(124,92,191,0.4); }
  .btn:hover::after { opacity:1; }
  .btn:active { transform:translateY(0); }
  .btn:disabled { background:rgba(124,92,191,0.3); cursor:not-allowed; transform:none; box-shadow:none; }

  /* Messages */
  .msg { margin-top:0.85rem; padding:0.6rem 0.85rem; font-family:'JetBrains Mono',monospace; font-size:0.68rem; letter-spacing:0.06em; display:none; position:relative; z-index:1; }
  .msg.error { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.25); color:var(--red); display:block; }
  .msg.success { background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.25); color:var(--green); display:block; }

  /* Terms note */
  .terms-note { font-size:0.72rem; color:var(--muted); text-align:center; margin-top:0.75rem; position:relative; z-index:1; }
  .terms-note a { color:var(--accent2); text-decoration:none; }
  .terms-note a:hover { text-decoration:underline; }

  /* Back */
  .back { text-align:center; margin-top:1.25rem; }
  .back a { font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:var(--muted); text-decoration:none; letter-spacing:0.1em; transition:color 0.2s; }
  .back a:hover { color:var(--accent2); }

  /* Status bar */
  .status-bar { display:flex; align-items:center; justify-content:center; gap:0.5rem; margin-top:1rem; }
  .status-dot { width:5px; height:5px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); animation:blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-text { font-family:'JetBrains Mono',monospace; font-size:0.58rem; color:var(--muted); letter-spacing:0.12em; }
</style>
</head>
<body>
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>
<div class="scanline"></div>

<div class="container">
  <div class="logo">
    <div class="logo-text">GRIMZ <span>CLOUD PC</span></div>
    <div class="logo-sub">// Cổng đăng nhập · Singapore Server</div>
  </div>

  <div class="card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-br"></div>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Đăng ký</div>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="email@example.com" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAACrS3npj6qFvSu2W" data-theme="dark"></div>
      <button class="btn" id="loginBtn" onclick="doLogin()">
        <span id="loginBtnText">Đăng nhập</span>
      </button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự">
      </div>
      <div class="form-group">
        <label>Nhập lại mật khẩu</label>
        <input type="password" id="regPassword2" placeholder="••••••••" onkeydown="if(event.key==='Enter')doRegister()">
      </div>
      <div class="cf-turnstile" data-sitekey="0x4AAAAAACrS3npj6qFvSu2W" data-theme="dark"></div>
      <button class="btn" id="regBtn" onclick="doRegister()">
        <span id="regBtnText">Tạo tài khoản</span>
      </button>
      <div class="msg" id="regMsg"></div>
      <div class="terms-note">
        Bằng cách đăng ký, bạn đồng ý với
        <a href="/terms" target="_blank">Điều khoản dịch vụ</a> và
        <a href="/privacy" target="_blank">Chính sách bảo mật</a>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot"></div>
    <span class="status-text">SERVER ONLINE · grimz.vercel.app</span>
  </div>

  <div class="back">
    <a href="index.html">← Về trang chủ</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient(
    'https://vlwevojqfomophsdwsqd.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsd2V2b2pxZm9tb3Boc2R3c3FkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NzE2NDgsImV4cCI6MjA4OTE0NzY0OH0.6NECwQqKKeZH2fIgqp8SkmA6kPAqtsc5dlhEdGVFgBE'
  );

  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = '/dashboard';
  });

  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    // Clear messages
    document.getElementById('loginMsg').className = 'msg';
    document.getElementById('regMsg').className = 'msg';
  }

  function showMsg(id, type, text) {
    const el = document.getElementById(id);
    el.className = 'msg ' + type;
    el.textContent = text;
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    document.getElementById('loginMsg').className = 'msg';
    if (!email || !password) { showMsg('loginMsg','error','Vui lòng điền đầy đủ thông tin.'); return; }
    const token = document.querySelector('#loginForm [name="cf-turnstile-response"]')?.value;
    if (!token) { showMsg('loginMsg','error','Vui lòng xác minh bạn không phải bot.'); return; }
    btn.disabled = true;
    btnText.textContent = 'Đang xác thực...';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showMsg('loginMsg','error','Email hoặc mật khẩu không đúng.');
      btn.disabled = false; btnText.textContent = 'Đăng nhập';
    } else {
      btnText.textContent = '✓ Thành công!';
      btn.style.background = 'rgba(74,222,128,0.8)';
      setTimeout(() => window.location.href = '/dashboard', 600);
    }
  }

  async function doRegister() {
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;
    const btn = document.getElementById('regBtn');
    const btnText = document.getElementById('regBtnText');
    document.getElementById('regMsg').className = 'msg';
    if (!email || !password) { showMsg('regMsg','error','Vui lòng điền đầy đủ thông tin.'); return; }
    if (password.length < 6) { showMsg('regMsg','error','Mật khẩu tối thiểu 6 ký tự.'); return; }
    if (password !== password2) { showMsg('regMsg','error','Mật khẩu không khớp.'); return; }
    const token = document.querySelector('#registerForm [name="cf-turnstile-response"]')?.value;
    if (!token) { showMsg('regMsg','error','Vui lòng xác minh bạn không phải bot.'); return; }
    btn.disabled = true; btnText.textContent = 'Đang tạo tài khoản...';
    const { error } = await sb.auth.signUp({ email, password });
    if (error) {
      showMsg('regMsg','error','Lỗi: ' + error.message);
      btn.disabled = false; btnText.textContent = 'Tạo tài khoản';
    } else {
      showMsg('regMsg','success','✓ Tạo tài khoản thành công! Đang chuyển sang đăng nhập...');
      btn.disabled = false; btnText.textContent = 'Tạo tài khoản';
      setTimeout(() => switchTab('login'), 2000);
    }
  }
</script>
</body>
</html>
