<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grimz Cloud PC — Đăng nhập</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #09080f; color: #e4e0f0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { width: 100%; max-width: 420px; padding: 20px; }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: #fff; }
  .logo h1 span { color: #7c3aed; }
  .card { background: #13131a; border: 1px solid #1e1e2e; border-radius: 12px; padding: 32px; }
  .tabs { display: flex; margin-bottom: 28px; border-bottom: 1px solid #1e1e2e; }
  .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 14px; color: #666; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab.active { color: #7c3aed; border-bottom-color: #7c3aed; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  input { width: 100%; padding: 12px 14px; background: #0a0a0f; border: 1px solid #1e1e2e; border-radius: 8px; color: #e0e0e0; font-size: 14px; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: #7c3aed; }
  .btn { width: 100%; padding: 13px; background: #7c3aed; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
  .btn:hover { background: #6d28d9; }
  .btn:disabled { background: #3d1f7a; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
  .msg.error { background: #2d0f0f; color: #f87171; border: 1px solid #7f1d1d; display: block; }
  .msg.success { background: #0f2d1a; color: #4ade80; border: 1px solid #14532d; display: block; }
  .back { text-align: center; margin-top: 20px; font-size: 13px; color: #555; }
  .back a { color: #7c3aed; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo"><h1>GRIMZ <span>CLOUD PC</span></h1></div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Đăng ký</div>
    </div>
    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="email@example.com"></div>
      <div class="form-group"><label>Mật khẩu</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
      <button class="btn" id="loginBtn" onclick="doLogin()">Đăng nhập</button>
      <div class="msg" id="loginMsg"></div>
    </div>
    <div id="registerForm" style="display:none">
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="email@example.com"></div>
      <div class="form-group"><label>Mật khẩu</label><input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự"></div>
      <div class="form-group"><label>Nhập lại mật khẩu</label><input type="password" id="regPassword2" placeholder="••••••••"></div>
      <button class="btn" id="regBtn" onclick="doRegister()">Tạo tài khoản</button>
      <div class="msg" id="regMsg"></div>
    </div>
  </div>
  <div class="back"><a href="index.html">← Trang chủ</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient(
    'https://vlwevojqfomophsdwsqd.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsd2V2b2pxZm9tb3Boc2R3c3FkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NzE2NDgsImV4cCI6MjA4OTE0NzY0OH0.6NECwQqKKeZH2fIgqp8SkmA6kPAqtsc5dlhEdGVFgBE'
  );

  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'grimz-dashboard.html';
  });

  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');
    const btn = document.getElementById('loginBtn');
    msg.className = 'msg';
    if (!email || !password) { msg.className = 'msg error'; msg.textContent = 'Vui lòng điền đầy đủ thông tin.'; return; }
    btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      msg.className = 'msg error'; msg.textContent = 'Email hoặc mật khẩu không đúng.';
      btn.disabled = false; btn.textContent = 'Đăng nhập';
    } else {
      window.location.href = 'grimz-dashboard.html';
    }
  }

  async function doRegister() {
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;
    const msg = document.getElementById('regMsg');
    const btn = document.getElementById('regBtn');
    msg.className = 'msg';
    if (!email || !password) { msg.className = 'msg error'; msg.textContent = 'Vui lòng điền đầy đủ thông tin.'; return; }
    if (password.length < 6) { msg.className = 'msg error'; msg.textContent = 'Mật khẩu tối thiểu 6 ký tự.'; return; }
    if (password !== password2) { msg.className = 'msg error'; msg.textContent = 'Mật khẩu không khớp.'; return; }
    btn.disabled = true; btn.textContent = 'Đang tạo tài khoản...';
    const { error } = await sb.auth.signUp({ email, password });
    if (error) {
      msg.className = 'msg error'; msg.textContent = 'Lỗi: ' + error.message;
      btn.disabled = false; btn.textContent = 'Tạo tài khoản';
    } else {
      msg.className = 'msg success'; msg.textContent = 'Tạo tài khoản thành công! Đăng nhập ngay.';
      btn.disabled = false; btn.textContent = 'Tạo tài khoản';
      setTimeout(() => switchTab('login'), 2000);
    }
  }
</script>
</body>
</html>
